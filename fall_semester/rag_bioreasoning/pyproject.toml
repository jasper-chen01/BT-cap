[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys-rag"
version = "0.2.0"
description = "Bioreasoning RAG over fall_semester/data (CellChat + DEGs + counts)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "streamlit>=1.32",
    "python-dotenv>=1.0",
    "google-auth>=2.28",
    "google-cloud-aiplatform>=1.60",
    "lightgbm>=4.3",
]

[project.scripts]
ephys-rag = "ephys_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
