# General pathway notes only. No Ephys count spoilers.
# Themes: neuron_tumor | immune_synapse | myeloid | adhesion | growth
# You may edit or replace this file.

pathways:
  PTN:
    themes: [neuron_tumor, growth]
    summary: >
      Pleiotrophin (PTN) binds PTPRZ1, nucleolin (NCL), and syndecan-3 (SDC3).
      PTN-PTPRZ1 is a core OPC/glioma growth axis and is also used in neural
      development. High probability here among OPC-like, AC-like, and cycling tumor
      cells.

  NRXN:
    themes: [neuron_tumor]
    summary: >
      Neurexins (NRXN1/2) bind neuroligins (NLGN1/3), LRRTMs, calsyntenin-1, and
      dystroglycan (DAG1). These are canonical trans-synaptic adhesion complexes that
      specify excitatory synapses.

  Glutamate:
    themes: [neuron_tumor]
    summary: >
      Glutamate released via SLC1A1/SLC1A3 + glutaminase (GLS) onto AMPA (GRIA2/3/4)
      and kainate (GRIK2) receptors. Glioma–neuron synapses are AMPA-receptor
      dependent; neuronal glutamate can drive tumor growth.

  NCAM:
    themes: [neuron_tumor, adhesion]
    summary: >
      Neural cell adhesion molecule (NCAM1/2) mediates axon–glia contact, synaptic
      stabilization, and glioma invasion.

  CNTN:
    themes: [neuron_tumor]
    summary: >
      Contactin-1 binds NRCAM (axon–glia) and NOTCH1. Classic node-of-Ranvier and
      oligodendroglial adhesion pathway.

  CADM:
    themes: [neuron_tumor, adhesion]
    summary: >
      CADM1 (SynCAM) is a synaptic adhesion molecule that can organize functional
      synapses and also mediate tumor–tumor contacts.

  CDH:
    themes: [adhesion, neuron_tumor]
    summary: >
      N-cadherin (CDH2) homophilic adhesion used by neural progenitors and glioma.

  MK:
    themes: [neuron_tumor, growth]
    summary: >
      Midkine (MDK) is a PTN-family heparin-binding factor that binds PTPRZ1, NCL, and
      LRP1. Promotes glioma stemness and neural development.

  NOTCH:
    themes: [neuron_tumor, growth]
    summary: >
      DLL1/DLL3 → NOTCH1; developmental and glioma stem-cell signaling.

  SLIT:
    themes: [neuron_tumor]
    summary: >
      SLIT1–ROBO1 axon guidance; can also restrict or guide glioma invasion.

  SLITRK:
    themes: [neuron_tumor]
    summary: >
      SLITRK2–PTPRD organizes excitatory synapses.

  PCDH:
    themes: [neuron_tumor, adhesion]
    summary: >
      Protocadherins used in neuronal self-avoidance and tiling.

  MPZ:
    themes: [neuron_tumor, adhesion]
    summary: >
      MPZL1 is related to myelin protein zero; glial adhesion.

  CLDN:
    themes: [neuron_tumor, adhesion]
    summary: >
      Claudin-11 is an oligodendrocyte tight-junction protein.

  JAM:
    themes: [adhesion]
    summary: >
      Junctional adhesion molecules (JAM2/3) at tight junctions and immune interfaces.

  PDGF:
    themes: [growth, neuron_tumor]
    summary: >
      PDGFA/B → PDGFRA; canonical OPC and proneural glioma growth factor.

  PSAP:
    themes: [neuron_tumor]
    summary: >
      Prosaposin → GPR37L1, a glia-enriched lysosomal / neurotrophic pair.

  MHC-II:
    themes: [immune_synapse]
    summary: >
      HLA-DR/DP/DQ/DM → CD4 is the core MHC class II immunological synapse between
      antigen-presenting cells and CD4 T cells.

  MHC-I:
    themes: [immune_synapse]
    summary: >
      HLA-E → KLRC2 (NKG2C) is a non-classical MHC-I pair on NK / innate-like T cells.

  MIF:
    themes: [immune_synapse]
    summary: >
      Macrophage migration inhibitory factor binds CD74 with CXCR4 or CD44
      co-receptors. Recruits and retains T cells and myeloid cells; also expressed by
      glioma.

  SPP1:
    themes: [immune_synapse, myeloid]
    summary: >
      Osteopontin (SPP1) → CD44 or αvβ1 integrin. TAM-derived SPP1 is a major T-cell /
      myeloid immunosuppressive signal in glioma.

  CD99:
    themes: [immune_synapse, adhesion]
    summary: >
      CD99 homophilic (and PILRA/PILRB) adhesion at leukocyte diapedesis and
      immunological synapses.

  CLEC:
    themes: [immune_synapse]
    summary: >
      CLEC2B/C/D (including CD69) → KLRB1 (CD161). Marks innate-like / tissue-resident
      T cells and can modulate TCR signaling.

  GALECTIN:
    themes: [immune_synapse, myeloid]
    summary: >
      Galectin-9 (LGALS9) binds TIM-3 (HAVCR2), CD44, CD45, and P4HB. LGALS9–TIM-3 is
      an exhaustion / glyco-immune checkpoint.

  CD45:
    themes: [immune_synapse]
    summary: >
      PTPRC (CD45) → MRC1 (CD206); phosphatase regulation of leukocyte activation.

  CD39:
    themes: [myeloid, immune_synapse]
    summary: >
      ENTPD1 (CD39) hydrolyzes ATP to adenosine; ADORA3 and TMIGD3 partners.

  ApoE:
    themes: [myeloid]
    summary: >
      APOE → TREM2/TYROBP is a core microglial lipid-sensing and disease-associated
      microglia pair.

  APP:
    themes: [myeloid, neuron_tumor]
    summary: >
      Amyloid precursor protein binds CD74, TREM2/TYROBP, and SORL1. Bridges
      neuronal/glioma APP with myeloid receptors.

  COMPLEMENT:
    themes: [myeloid]
    summary: >
      C3 → C3AR1 or CR4 (ITGAX/ITGB2); classical myeloid complement sensing.

  LAIR1:
    themes: [myeloid, immune_synapse]
    summary: >
      LAIR1–LILRB4 inhibitory myeloid receptors.

  GAS:
    themes: [myeloid]
    summary: >
      GAS6 → AXL/MERTK; TAM-family efferocytosis and glioma–myeloid crosstalk.

  GRN:
    themes: [myeloid]
    summary: >
      Progranulin → SORT1; microglial lysosomal / neurotrophic signaling.

  TNF:
    themes: [myeloid, immune_synapse]
    summary: >
      TNF → TNFRSF1A/B inflammatory cytokine pair.

  TGFb:
    themes: [myeloid, immune_synapse]
    summary: >
      TGFB1 → TGFBR1/2; immunosuppression and glioma invasion.

  CypA:
    themes: [adhesion, immune_synapse]
    summary: >
      Cyclophilin A (PPIA) → basigin/CD147 (BSG). Involved in T-cell activation,
      leukocyte migration, and tumor metabolism.

  EGF:
    themes: [growth, immune_synapse]
    summary: >
      AREG or HBEGF -> EGFR. Wound-repair and glioma growth factor. In this table,
      EGF also marks a T-cell sender program that appears on Ephys_2 but not Ephys_1.

  ANNEXIN:
    themes: [immune_synapse]
    summary: >
      ANXA1 → FPR1; pro-resolving / glucocorticoid-regulated leukocyte signal.

  Prostaglandin:
    themes: [immune_synapse]
    summary: >
      PGE2 (PTGES2/3) → PTGER4; suppresses T-cell effector function in tumors.

  COLLAGEN:
    themes: [adhesion]
    summary: >
      COL9A1 → CD44 or αvβ8 integrin; ECM–cell adhesion.

  THY1:
    themes: [adhesion, immune_synapse]
    summary: >
      THY1 (CD90) → CR4 integrin; stem-like / stromal adhesion.
