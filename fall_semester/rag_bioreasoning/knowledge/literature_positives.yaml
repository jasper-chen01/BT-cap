# External positives for the LightGBM ranker (PU learning).
#
# A row (gene x cell type x IDH) is labeled positive when its gene is listed here
# AND its DEG compartment is in `compartments`. Everything else is unlabeled, not negative.
# Compartment codes match the DEG table `compartment` column: tumor, T_cell, TAM_microglia.
#
# tier 1: direct functional evidence for this gene in glioma in this compartment.
# tier 2: pathway-level / family-level support only. Labeled by default;
#         `ephys-rag rank --tiers 1` is the strict literature-only run.
#
# Draft list. The team should review it before the ranking is reported.
# Do not add genes because they score well in our own tables; that makes the labels circular.

positives:
  # --- neuron-tumor synaptic-like (H2) ---
  - gene: NLGN3
    compartments: [tumor]
    tier: 1
    hypothesis: neuron_tumor
    reference: "Venkatesh et al., Cell 2015; Venkatesh et al., Nature 2017"
